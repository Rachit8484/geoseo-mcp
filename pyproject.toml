[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geoseo-mcp"
version = "0.4.0"
description = "MCP server for SEO + GEO: Search Console, Bing, IndexNow, AI Overviews, and LLM citation tracking across ChatGPT, Claude, Gemini and Perplexity."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rachit Agarwal" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "seo",
    "geo",
    "aeo",
    "google-search-console",
    "bing-webmaster",
    "indexnow",
    "llm",
    "ai-overviews",
    "chatgpt",
    "claude",
    "gemini",
    "perplexity",
    "llms-txt",
    "generative-engine-optimization",
    "ai-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "fastmcp>=3.0,<4",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
# JavaScript rendering for audit_page(render=True). Run `playwright install chromium` after.
render = ["playwright>=1.45"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
geoseo-mcp = "geoseo_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Rachit8484/geoseo-mcp"
Repository = "https://github.com/Rachit8484/geoseo-mcp"
Issues = "https://github.com/Rachit8484/geoseo-mcp/issues"
Changelog = "https://github.com/Rachit8484/geoseo-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/geoseo_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/geoseo_mcp", "tests", "README.md", "LICENSE", "CHANGELOG.md", "server.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
